name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Export Debug APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Locate Android Project & Grant Gradlew Permissions
        run: |
          # If the Android project is stored inside a subfolder, enter it
          if [ -d "EmotionDetection_AndroidApp" ]; then
            echo "Entering EmotionDetection_AndroidApp directory..."
            cd EmotionDetection_AndroidApp
          fi
          
          # Check for gradlew executable or generate wrapper
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            echo "Generating Gradle wrapper..."
            gradle wrapper || true
            if [ -f "./gradlew" ]; then
              chmod +x ./gradlew
            fi
          fi

      - name: Build Debug APK
        run: |
          if [ -d "EmotionDetection_AndroidApp" ]; then
            cd EmotionDetection_AndroidApp
          fi
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EmotionHUD-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/release/*.apk
          retention-days: 14
