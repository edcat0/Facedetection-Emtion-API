<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#00ffc4">
  <title>Emotion Detection HUD</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #000;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    #stage {
      position: relative; width: 100vw; height: 100vh;
      display: flex; justify-content: center; align-items: center; background: #000;
    }
    video#cameraStream {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover; transform: scaleX(-1);
    }
    video#cameraStream.rear-mode {
      transform: scaleX(1);
    }
    canvas#hudCanvas {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover; z-index: 10; pointer-events: none;
    }

    /* Top Status Bar */
    #topBar {
      position: absolute; top: 16px; left: 16px; right: 16px;
      display: flex; justify-content: space-between; align-items: center;
      z-index: 40; pointer-events: auto;
    }
    .badge {
      background: rgba(13, 17, 23, 0.9); color: #00ffc4;
      padding: 7px 16px; border-radius: 20px; font-size: 13px; font-weight: 600;
      border: 1px solid rgba(0, 255, 196, 0.35); backdrop-filter: blur(10px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.6); display: flex; align-items: center; gap: 8px;
    }
    .status-dot {
      width: 9px; height: 9px; border-radius: 50%; background: #ff4757;
      transition: background 0.25s, box-shadow 0.25s;
    }
    .status-dot.active { background: #00ffc4; box-shadow: 0 0 10px #00ffc4; }

    .btn-circle {
      background: rgba(13, 17, 23, 0.9); border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff; width: 44px; height: 44px; border-radius: 50%;
      display: flex; justify-content: center; align-items: center;
      cursor: pointer; backdrop-filter: blur(10px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.6);
      transition: transform 0.15s, background 0.15s;
    }
    .btn-circle:active { transform: scale(0.92); background: rgba(0, 255, 196, 0.25); }
    .btn-circle:disabled { opacity: 0.5; pointer-events: none; }

    /* Bottom Control Bar: Shutter & Video Record */
    #bottomControls {
      position: absolute; bottom: 28px; left: 0; right: 0;
      display: flex; justify-content: space-around; align-items: center;
      z-index: 40; padding: 0 24px; pointer-events: auto;
    }
    #photoBtn {
      width: 72px; height: 72px; border-radius: 50%;
      background: #ffffff; border: 5px solid rgba(0, 255, 196, 0.9);
      box-shadow: 0 0 20px rgba(0, 255, 196, 0.5);
      cursor: pointer; display: flex; justify-content: center; align-items: center;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    #photoBtn:active { transform: scale(0.9); }
    #photoBtn .inner {
      width: 52px; height: 52px; border-radius: 50%;
      background: #ffffff; border: 2px solid #000;
    }

    #recordBtn {
      width: 56px; height: 56px; border-radius: 50%;
      background: rgba(13, 17, 23, 0.85); border: 2px solid rgba(255, 71, 87, 0.8);
      cursor: pointer; display: flex; justify-content: center; align-items: center;
      transition: transform 0.15s;
    }
    #recordBtn:active { transform: scale(0.92); }
    #recordBtn .rec-dot {
      width: 24px; height: 24px; border-radius: 50%; background: #ff4757;
      transition: all 0.2s;
    }
    #recordBtn.recording .rec-dot {
      border-radius: 4px; width: 20px; height: 20px;
    }

    #permissionCard {
      position: absolute; z-index: 60; background: rgba(13, 17, 23, 0.95);
      padding: 24px; border-radius: 16px; border: 1px solid #00ffc4;
      text-align: center; color: #fff; max-width: 320px; display: none;
      box-shadow: 0 8px 32px rgba(0,0,0,0.8);
    }
    #permissionCard button {
      background: #00ffc4; color: #000; border: none; font-weight: bold;
      padding: 12px 24px; border-radius: 24px; margin-top: 16px; cursor: pointer;
    }
    #notificationToast {
      position: absolute; bottom: 110px; left: 50%; transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85); color: #00ffc4; padding: 8px 18px;
      border-radius: 20px; font-size: 13px; font-weight: 500; z-index: 50;
      border: 1px solid rgba(0, 255, 196, 0.4); display: none; text-align: center;
    }
  </style>

  <!-- Modern Face-API Neural Network for Face + Emotion Recognition -->
  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.min.js"></script>
</head>
<body>
  <div id="stage">
    <video id="cameraStream" autoplay playsinline muted></video>
    <canvas id="hudCanvas"></canvas>

    <div id="topBar">
      <div class="badge" id="aiStatus">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">Initializing Neural AI...</span>
      </div>
      <button class="btn-circle" id="flipCamBtn" title="Switch Camera">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 16v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-4"/>
          <polyline points="10 9 9 4 4 5"/>
          <path d="M4 5a9 9 0 0 1 15 5"/>
          <polyline points="14 15 15 20 20 19"/>
          <path d="M20 19a9 9 0 0 1-15-5"/>
        </svg>
      </button>
    </div>

    <div id="notificationToast"></div>

    <div id="bottomControls">
      <button id="recordBtn" title="Record Video with Meters">
        <div class="rec-dot"></div>
      </button>

      <button id="photoBtn" title="Take Photo with Meters">
        <div class="inner"></div>
      </button>

      <div style="width: 56px;"></div>
    </div>

    <div id="permissionCard">
      <h3 style="margin-top:0;">Camera Access Required</h3>
      <p style="font-size: 14px; color: #ccc;">Please allow camera access to analyze facial emotions in real time.</p>
      <button id="grantPermBtn">Enable Camera</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
